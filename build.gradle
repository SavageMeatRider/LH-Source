buildscript {
    repositories {
        jcenter()
        maven { url = "http://files.minecraftforge.net/maven" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version          = "1.0"
group            = "com.LastHit.Source"
archivesBaseName = "AutoHit"

minecraft {
    version  = "1.8.9-11.15.1.2318-1.8.9"
    runDir   = "run"
    mappings = "stable_22"
}

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

repositories {
    mavenCentral()
}

dependencies {
    // No extra deps — pure Forge + vanilla
}

// ── Make sure mcmod.info ends up at the ROOT of the jar ───────────────────────
sourceSets {
    main {
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

processResources {
    // Do NOT use expand() here — we use literal values in mcmod.info now
    inputs.property "version",   project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes(
                "Manifest-Version"    : "1.0",
                // This tells Forge this jar IS a mod (required for 1.8.9 Forge loader)
                "ModSide"             : "CLIENT"
        )
    }
}