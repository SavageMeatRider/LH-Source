<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LH Mod</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0e0b14;
      color: #d4cfe8;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      top: -200px; left: 50%;
      transform: translateX(-50%);
      width: 700px; height: 500px;
      background: radial-gradient(ellipse, rgba(124,58,237,0.18) 0%, transparent 70%);
      pointer-events: none;
    }
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.1rem 2rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .logo { font-weight: 700; font-size: 1rem; color: #a78bfa; letter-spacing: 0.05em; }
    nav a { color: #6b7280; font-size: 0.82rem; text-decoration: none; margin-left: 1.5rem; }
    nav a:hover { color: #d4cfe8; }

    .hero {
      text-align: center;
      padding: 5rem 1.5rem 3.5rem;
      max-width: 600px; margin: 0 auto;
    }
    .hero h1 {
      font-size: clamp(2.4rem, 6vw, 3.8rem);
      font-weight: 700; line-height: 1.1; color: #fff;
      margin-bottom: 1rem;
    }
    .hero h1 em { font-style: normal; color: #a78bfa; }
    .hero p {
      color: #6b7280; font-size: 0.95rem;
      max-width: 380px; margin: 0 auto 2.5rem; line-height: 1.7;
    }

    /* label above button */
    .dl-label {
      display: inline-flex; align-items: center; gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .dl-label-line {
      width: 28px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(167,139,250,0.4));
    }
    .dl-label-line.right {
      background: linear-gradient(90deg, rgba(167,139,250,0.4), transparent);
    }
    .dl-label-text {
      font-size: 0.7rem; font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: #7c5fc7;
    }
    .dl-label-text span {
      color: #a78bfa;
    }

    .dl-btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: #7c3aed; color: #fff;
      font-weight: 600; font-size: 0.95rem;
      padding: 0.8rem 2rem; border-radius: 9999px;
      text-decoration: none;
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 0 30px rgba(124,58,237,0.4);
    }
    .dl-btn:hover { background: #6d28d9; transform: translateY(-2px); }
    .dl-btn:active { transform: translateY(0); }

    footer {
      text-align: center; padding: 2rem;
      font-size: 0.75rem; color: #374151;
      border-top: 1px solid rgba(255,255,255,0.04);
      position: fixed; bottom: 0; width: 100%;
    }
    footer a { color: #4b5563; text-decoration: none; }
    footer a:hover { color: #9ca3af; }
  </style>
</head>
<body>

<nav>
  <div class="logo">LH</div>
  <div>
    <a href="https://github.com/SavageMeatRider/LH-Source" target="_blank">GitHub</a>
    <a href="https://github.com/SavageMeatRider/LH-Source/releases" target="_blank">Releases</a>
  </div>
</nav>

<div class="hero">
  <h1>Last Hit.<br><em>Win the tag.</em></h1>
  <p>Free, open-source Forge mod for TNT Tag. Be the one tagging — not the one exploding.</p>

  <div class="dl-label">
    <div class="dl-label-line"></div>
    <div class="dl-label-text">LH <span>·</span> Source <span>·</span> Latest</div>
    <div class="dl-label-line right"></div>
  </div>
  <br>
  <a id="main-dl" class="dl-btn" href="https://github.com/SavageMeatRider/LH-Source/releases/latest" target="_blank">↓ Download</a>
</div>

<footer>
  By <a href="https://github.com/SavageMeatRider" target="_blank">SavageMeatRider</a> ·
  <a href="https://github.com/SavageMeatRider/LH-Source" target="_blank">Open Source</a>
</footer>

<script>
const OWNER = 'SavageMeatRider', REPO = 'LH-Source';
async function init() {
  try {
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/releases/latest`);
    const release = await res.json();
    const jar = release.assets && release.assets.find(a => a.name.endsWith('.jar'));
    if (jar) document.getElementById('main-dl').href = jar.browser_download_url;
  } catch(e) {}
}
init();
</script>
</body>
</html>
